<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Tyre Details | Tyre Pulse</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
    <link href="style.css" rel="stylesheet" />
    <script src="js/theme.js"></script>
</head>

<body>
    <div class="container-fluid p-0">
        <div class="row g-0">
            <div class="col-md-2 sidebar d-none d-md-block">
                <h4><i class="bi bi-vinyl-fill text-danger me-2"></i>Tyre Pulse</h4>
                <div class="mt-4">
                    <a href="dashboard.html"><i class="bi bi-grid-fill"></i> Dashboard</a>
                    <a href="tyre-details.html" class="active"><i class="bi bi-truck"></i> Tyre Details</a>
                    <a href="wear-analysis.html"><i class="bi bi-graph-up-arrow"></i> Wear Analysis</a>
                    
                    <a href="blog.html"><i class="bi bi-newspaper"></i> Blogs</a>
                    <a href="chatbot.html"><i class="bi bi-chat-dots"></i> Chatbot</a>
                </div>
                <div style="position: absolute; bottom: 30px; width: 100%;">
                    <a href="#" onclick="window.toggleTheme(event)"><i class="bi bi-moon-fill theme-icon"></i> Toggle
                        Theme</a>
                    <a href="index.html" id="logoutBtn"><i class="bi bi-box-arrow-right"></i> Logout</a>
                </div>
            </div>

            <div class="col-md-10 p-4 p-lg-5 fade-in-up">
                <div class="d-flex justify-content-between align-items-center mb-5">
                    <div>
                        <h2 class="section-title mb-1">Vehicle & Tyre Details 🚙</h2>
                        <p class="text-muted mb-0">Manage your registered vehicles and their tyre specifications.</p>
                    </div>
                    <button class="btn btn-primary-custom" data-bs-toggle="modal" data-bs-target="#vehicleModal">
                        <i class="bi bi-plus-lg me-2"></i>Add Vehicle
                    </button>
                </div>

                <div id="fleetContainer" class="row g-4">
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="vehicleModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content border-0 rounded-4 shadow-lg">
                <div class="modal-header border-bottom-0 pb-0 px-4 pt-4">
                    <h5 class="modal-title fw-bold">Register New Vehicle</h5>
                    <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="addVehicleForm">
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label text-muted small fw-semibold">Vehicle Name (e.g. Honda
                                    Civic)</label>
                                <input type="text" name="vehicleName" class="form-control bg-light border-0 py-2"
                                    required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted small fw-semibold">License Plate</label>
                                <input type="text" name="licensePlate" class="form-control bg-light border-0 py-2"
                                    required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted small fw-semibold">Current Odometer (km)</label>
                                <input type="number" name="currentOdo" class="form-control bg-light border-0 py-2"
                                    required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted small fw-semibold">Avg. Daily Travel (km)</label>
                                <input type="number" name="avgDaily" class="form-control bg-light border-0 py-2"
                                    required>
                            </div>
                        </div>

                        <h6 class="fw-bold mb-3 border-bottom pb-2">Tyre Configuration (Expected Life)</h6>
                        <div class="row g-3">
                            <div class="col-md-6"><input type="number" name="exp_fl"
                                    class="form-control bg-light border-0" placeholder="Front Left (km)" value="40000">
                            </div>
                            <div class="col-md-6"><input type="number" name="exp_fr"
                                    class="form-control bg-light border-0" placeholder="Front Right (km)" value="40000">
                            </div>
                            <div class="col-md-6"><input type="number" name="exp_rl"
                                    class="form-control bg-light border-0" placeholder="Rear Left (km)" value="40000">
                            </div>
                            <div class="col-md-6"><input type="number" name="exp_rr"
                                    class="form-control bg-light border-0" placeholder="Rear Right (km)" value="40000">
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-top-0 px-4 pb-4 pt-0">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary-custom" onclick="saveVehicle()">Save Vehicle</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <!-- Project Scripts -->
    <script src="js/config.js"></script>
    <script src="js/db.js"></script>
    <script src="js/auth.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!window.authService || !window.authService.isAuthenticated()) {
                window.location.href = 'login.html';
                return;
            }

            // Logout
            const logoutBtn = document.getElementById("logoutBtn");
            if (logoutBtn) {
                logoutBtn.addEventListener("click", function (e) {
                    e.preventDefault();
                    window.authService.logout();
                });
            }

            // Load Fleet
            const container = document.getElementById('fleetContainer');
            try {
                const vehicles = await window.dbService.getVehicles();
                if (vehicles.length === 0) {
                    container.innerHTML = '<div class="col-12"><p class="text-muted">No vehicles registered yet.</p></div>';
                    return;
                }

                container.innerHTML = '';
                vehicles.forEach(v => {
                    container.innerHTML += `
                        <div class="col-md-6 col-lg-4 fade-in-up">
                            <div class="card p-4 h-100 hover-lift border border-light">
                                <h5 class="fw-bold text-dark mb-1"><i class="bi bi-car-front-fill text-primary me-2"></i>${v.name}</h5>
                                <p class="text-muted small mb-3 border-bottom pb-3">Plate: ${v.plate}</p>
                                <div class="d-flex justify-content-between mb-2 small text-dark fw-medium">
                                    <span>Odometer:</span>
                                    <span>${v.currentOdometer.toLocaleString()} km</span>
                                </div>
                                <div class="d-flex justify-content-between mb-4 small text-dark fw-medium border-bottom pb-3">
                                    <span>Avg. Daily:</span>
                                    <span>${v.avgDailyKm || 40} km</span>
                                </div>
                                <button class="btn btn-outline-primary rounded-pill w-100 btn-sm" onclick="window.location.href='wear-analysis.html'">View Analysis</button>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                container.innerHTML = '<div class="col-12"><p class="text-danger">Failed to load vehicles.</p></div>';
            }
        });

        async function saveVehicle() {
            const form = document.getElementById('addVehicleForm');
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            // Disable button and show loader
            const btn = document.querySelector('#vehicleModal .btn-primary-custom');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Saving...';
            btn.disabled = true;

            try {
                const formData = new FormData(form);
                const vehicle = {
                    name: formData.get('vehicleName'),
                    plate: formData.get('licensePlate'),
                    currentOdometer: Number(formData.get('currentOdo')),
                    avgDailyKm: Number(formData.get('avgDaily')),
                    tyres: {
                        front_left: { position: 'Front Left', expectedLifeKm: Number(formData.get('exp_fl')), installationKm: Number(formData.get('currentOdo')) },
                        front_right: { position: 'Front Right', expectedLifeKm: Number(formData.get('exp_fr')), installationKm: Number(formData.get('currentOdo')) },
                        back_left: { position: 'Rear Left', expectedLifeKm: Number(formData.get('exp_rl')), installationKm: Number(formData.get('currentOdo')) },
                        back_right: { position: 'Rear Right', expectedLifeKm: Number(formData.get('exp_rr')), installationKm: Number(formData.get('currentOdo')) }
                    }
                };

                await window.dbService.addVehicle(vehicle);
                const modal = bootstrap.Modal.getInstance(document.getElementById('vehicleModal'));
                if (modal) modal.hide();
                window.location.reload();
            } catch (err) {
                console.error(err);
                alert("Error saving vehicle. Please try again.");
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }
    </script>
</body>

</html>
